<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>{{TITLE}}</title>
<style>
:root{color-scheme:dark;font:16px system-ui,sans-serif;background:#111319;color:#eef0f6}
body{margin:0;min-height:100dvh;display:grid;place-items:center}
#stage{position:relative;width:min(100vw,calc(100dvh * {{WIDTH}} / {{HEIGHT}}),{{WIDTH}}px);aspect-ratio:{{WIDTH}}/{{HEIGHT}}}
canvas{display:block;width:100%;height:100%;visibility:hidden;touch-action:none;outline:none}
#gate{position:absolute;inset:0;display:grid;align-content:center;justify-items:center;gap:14px;padding:20px;box-sizing:border-box;text-align:center;background:#1c212e}
#gate[hidden]{display:none}h1{font-size:clamp(20px,4vw,32px);margin:0}p{margin:0;max-width:50ch;overflow-wrap:anywhere}
button{font:inherit;font-weight:600;min-width:140px;min-height:46px;border:1px solid #659be0;border-radius:6px;background:#3062a5;color:white;padding:10px 20px;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}button:focus-visible{outline:3px solid #aed1ff;outline-offset:4px}
</style>
</head>
<body>
<main id="stage">
<canvas id="game" tabindex="0" aria-label="{{TITLE}}" aria-hidden="true"></canvas>
<section id="gate" aria-label="Game loading">
<h1>{{TITLE}}</h1><p id="status" role="status" aria-live="polite">Loading game…</p>
<button id="start" disabled>Loading…</button>
</section>
</main>
<script>if(location.protocol==='file:'){document.getElementById('status').textContent='Serve this game folder over HTTP or HTTPS, then open its address in your browser.';document.getElementById('gate').dataset.state='error';document.getElementById('start').textContent='HTTP required'}</script>
<script type="module" src="./game.js" onerror="if(location.protocol!=='file:'){document.getElementById('status').textContent='Could not load game loader. Check the connection and reload.';document.getElementById('gate').dataset.state='error';const button=document.getElementById('start');button.disabled=false;button.textContent='Reload game';button.onclick=()=>location.reload()}"></script>
</body>
</html>
