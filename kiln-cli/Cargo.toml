[package]
name = "kiln-cli"
license.workspace = true
repository.workspace = true
version.workspace = true
edition.workspace = true

[[bin]]
name = "kiln-cli"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
kiln-assets = { workspace = true }
kiln-core = { workspace = true }
kiln-runtime = { workspace = true, features = ["audio"] }
kiln-updater = { workspace = true }
kiln-ui = { workspace = true, features = ["fonts"] }
anyhow = { workspace = true }
serde_json = { workspace = true }
ron = { workspace = true }
uuid = { workspace = true }
walkdir = { workspace = true }
image = { workspace = true }

[package.metadata.dist]
dist = true
