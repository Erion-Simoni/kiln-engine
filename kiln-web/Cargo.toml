[package]
name = "kiln-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
# Documents intent; Workers path is always compiled and auto-falls back when
# the page is not cross-origin isolated. No SharedArrayBuffer atomics pool yet.
threads = []

[dependencies]
wasm-bindgen = "0.2.129"
js-sys = "0.3"
web-sys = { version = "0.3.106", features = [
    "console",
    "Window",
    "Worker",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "MessageEvent",
    "Request",
    "RequestInit",
    "Response",
    "Headers",
    "ReadableStream",
] }
console_error_panic_hook = "0.1.7"

[lib]
crate-type = ["cdylib", "rlib"]
