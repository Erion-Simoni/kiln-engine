[package]
name = "kiln-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
threads = []

[dependencies]
wasm-bindgen = "0.2.129"
js-sys = "0.3"
web-sys = { version = "0.3.106", features = [
    "console",
    "Window",
    "Worker",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "MessageEvent",
    "Request",
    "RequestInit",
    "Response",
    "Headers",
    "ReadableStream",
    "HtmlCanvasElement",
    "Element",
    "Node",
    "EventTarget",
    "KeyboardEvent",
    "WheelEvent",
    "MouseEvent",
    "AddEventListenerOptions",
] }
console_error_panic_hook = "0.1.7"
pollster = { workspace = true }
wgpu = { workspace = true }
glam = { workspace = true }
bytemuck = { workspace = true }
kiln-core = { workspace = true }
kiln-runtime = { workspace = true }
kiln-assets = { workspace = true }
kiln-render = { workspace = true }
log = { workspace = true }
getrandom = { workspace = true }
getrandom_02 = { workspace = true }
wasm-bindgen-futures = "0.4"
uuid = { workspace = true, features = ["rng-getrandom"] }
raw-window-handle = "0.6"

[lib]
crate-type = ["cdylib", "rlib"]
