[package]
name = "kiln-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
threads = []

[dependencies]
wasm-bindgen = "0.2.129"
js-sys = "0.3"
web-sys = { version = "0.3.106", features = [
    "console",
    "Window",
    "Document",
    "Worker",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "MessageEvent",
    "Request",
    "RequestInit",
    "Response",
    "Headers",
    "ReadableStream",
    "HtmlCanvasElement",
    "Element",
    "Node",
    "EventTarget",
    "KeyboardEvent",
    "WheelEvent",
    "MouseEvent",
    "AddEventListenerOptions",
    "TouchEvent",
    "AudioContext",
    "BaseAudioContext",
    "AudioNode",
    "AudioParam",
    "AudioDestinationNode",
    "AudioBufferSourceNode",
    "AudioScheduledSourceNode",
    "TouchList",
    "Touch",
    "HtmlImageElement",
    "DomRect",
    "GainNode",
    "AudioBuffer",
    "RequestMode",
] }
console_error_panic_hook = "0.1.7"
pollster = { workspace = true }
wgpu = { workspace = true, features = ["webgpu", "webgl"] }
glam = { workspace = true }
bytemuck = { workspace = true }
kiln-core = { workspace = true }
kiln-runtime = { workspace = true }
kiln-assets = { workspace = true }
kiln-render = { workspace = true }
kiln-ui = { workspace = true }
log = { workspace = true }
wasm-bindgen-futures = "0.4"
image = { version = "0.25", features = ["png"] }

[lib]
crate-type = ["cdylib", "rlib"]
