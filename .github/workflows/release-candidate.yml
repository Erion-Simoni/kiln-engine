name: Release candidate verification

on:
  workflow_dispatch:
  push:
    branches: [master, main, feat/2d-production-workflow]
    paths:
      - .github/workflows/release-candidate.yml
      - Cargo.toml
      - Cargo.lock
      - kiln-*/**
      - tools/**
      - packaging/**
      - templates/**
      - samples/**
      - tests/**

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '1'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  PYTHONDONTWRITEBYTECODE: '1'
  RUST_TOOLCHAIN: '1.99.1'

jobs:
  candidate:
    name: Build and accept a locked Linux candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
          key: release-tools-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
      - name: Install the tested toolchain and standard library notices
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy,rust-docs --target wasm32-unknown-unknown
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/web/package-lock.json
      - name: Install Linux build and software acceptance requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libssl-dev pkg-config xvfb xdotool imagemagick
          sudo xargs -a packaging/linux-runtime-packages.txt apt-get install -y
      - name: Prepare locked dependencies and matching build tools
        run: |
          cargo fetch --locked
          cargo install cargo-nextest --version 0.9.151 --locked
          wasm_bindgen_version=$(python3 -c 'import tomllib; p=tomllib.load(open("Cargo.lock","rb")); v={p["version"] for p in p["package"] if p["name"]=="wasm-bindgen"}; assert len(v)==1; print(v.pop())')
          cargo install wasm-bindgen-cli --version "$wasm_bindgen_version" --locked
      - name: Run native quality gates and tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo check --workspace --locked
          cargo check --manifest-path samples/audio/Cargo.toml
          cargo nextest run --workspace --locked
          python3 -m unittest discover -s tests/native -p 'test_*.py'
      - name: Build a captured release candidate
        run: python3 tools/build_editor.py --profile release --jobs 1 --output target/ci-release
      - name: Rebuild frozen inputs into fresh outputs
        run: python3 tools/build_editor.py --profile release --jobs 1 --source-from target/ci-release --output target/ci-replay
      - name: Require all native and browser payloads to match
        run: python3 tools/compare_builds.py target/ci-release target/ci-replay --output target/ci-release-comparison.json
      - name: Prepare browser acceptance
        working-directory: tests/web
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Accept release browser material and physics behavior
        env:
          KILN_CLI_PATH: ${{ github.workspace }}/target/ci-release/target/x86_64-unknown-linux-gnu/release/kiln-cli
          WEB_MATERIAL_EVIDENCE: target/ci-material-evidence
          WEB_PHYSICS_EVIDENCE: target/ci-physics-evidence
        run: |
          node tests/web/materials.cjs target/ci-release/web-runtime
          node tests/web/physics.cjs target/ci-release/web-runtime
      - name: Accept moved editor and exported native/browser games
        env:
          KILN_PORTABLE_EVIDENCE_DIR: target/ci-portable-evidence
        run: python3 tests/native/portable_editor_smoke.py target/ci-release/kiln-portable.tar.gz
      - name: Accept clean Ubuntu runtime without source or Rust
        run: python3 tools/test_clean_linux.py target/ci-release/kiln-portable.tar.gz --evidence target/ci-clean-linux-evidence
      - name: Stage the accepted candidate and its records
        run: |
          mkdir target/ci-candidate
          cp target/ci-release/kiln-portable.tar.gz target/ci-release/source.tar.gz target/ci-release/build-record.json target/ci-release/build-driver.py target/ci-candidate/
          cp target/ci-release-comparison.json target/ci-candidate/comparison.json
      - name: Upload accepted candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kiln-linux-candidate-${{ github.sha }}
          path: target/ci-candidate/
          if-no-files-found: error
          retention-days: 14
      - name: Retain acceptance and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kiln-candidate-evidence-${{ github.sha }}
          path: |
            target/ci-release/logs/
            target/ci-release/build-record.json
            target/ci-release/result.json
            target/ci-replay/logs/
            target/ci-replay/build-record.json
            target/ci-replay/result.json
            target/ci-release-comparison.json
            target/ci-material-evidence/
            target/ci-physics-evidence/
            target/ci-portable-evidence/
            target/ci-clean-linux-evidence/
          if-no-files-found: warn
          retention-days: 7

  attest:
    name: Attest accepted candidate origin
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kiln-linux-candidate-${{ github.sha }}
          path: candidate
      - name: Create GitHub build-origin attestation
        id: provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            candidate/kiln-portable.tar.gz
            candidate/source.tar.gz
            candidate/build-record.json
            candidate/build-driver.py
            candidate/comparison.json
      - name: Retain the attestation bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kiln-candidate-attestation-${{ github.sha }}
          path: ${{ steps.provenance.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 14
