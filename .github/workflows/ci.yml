name: CI

on:
  push:
    branches: [main, master, "fix/**"]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: '1.99.1'

jobs:
  check:
    name: Check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Install Linux audio/controller development headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check
        run: cargo check --workspace --locked
      - name: Check native feature opt-out
        run: |
          cargo check -p kiln-editor --no-default-features
          cargo check -p kiln-player --no-default-features
      - name: Check Linux audio configurations
        if: runner.os == 'Linux'
        run: |
          cargo check -p kiln-editor --features audio
          cargo check --manifest-path samples/audio/Cargo.toml

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cargo-nextest
        run: cargo install cargo-nextest --version 0.9.151 --locked
      - name: Install Linux audio/controller development headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libgl1-mesa-dri mesa-vulkan-drivers
      - name: Run tests
        run: cargo nextest run --workspace --locked
      - name: Test portable package preparation and captured builds
        run: python3 -m unittest discover -s tests/native -p 'test_*.py'

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install Linux audio/controller development headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - name: Build release
        run: cargo build --workspace --release --locked

  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install mdbook
        run: cargo install mdbook --version 0.4.52 --locked
      - name: Build documentation
        run: mdbook build docs
      - name: Upload docs artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docs
          path: docs/book/
          retention-days: 7

  deploy-docs:
    name: Deploy to GitHub Pages
    needs: docs
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Download docs artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: docs
          path: docs/book
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

  dist:
    name: Build experimental desktop binary archives
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install cargo-dist on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://github.com/axodotdev/cargo-dist/releases/download/v0.33.0/cargo-dist-installer.sh --output "$RUNNER_TEMP/cargo-dist-installer.sh"
          sh "$RUNNER_TEMP/cargo-dist-installer.sh"
      - name: Install cargo-dist on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'cargo-dist-installer.ps1'
          Invoke-WebRequest -Uri 'https://github.com/axodotdev/cargo-dist/releases/download/v0.33.0/cargo-dist-installer.ps1' -OutFile $installer -ErrorAction Stop
          & $installer
      - name: Require pinned cargo-dist version
        shell: bash
        run: test "$(dist --version)" = 'cargo-dist 0.33.0'
      - name: Install Linux audio/controller development headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
      - name: Run cargo-dist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/distribution-logs
          dist build --artifacts=all --target=${{ matrix.target }} 2>&1 | tee target/distribution-logs/build.log
      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-${{ matrix.os }}
          path: target/distrib/
          if-no-files-found: error
      - name: Retain distribution diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist-diagnostics-${{ matrix.os }}
          path: target/distribution-logs/
          if-no-files-found: warn
          retention-days: 7

  native-ui-smoke:
    name: Native editor and saved UI smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-x11-0 libgl1-mesa-dri mesa-vulkan-drivers xvfb xdotool imagemagick
      - name: Build the native editor and player
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
        run: cargo build --locked -p kiln-player -p kiln-editor -p kiln-cli --bins
      - name: Exercise editor authoring, preview isolation and Play controls
        env:
          KILN_EDITOR_EVIDENCE_DIR: target/editor-design-evidence
        run: python3 tests/native/editor_smoke.py
      - name: Exercise saved menus and settings
        env:
          KILN_UI_EVIDENCE_DIR: target/native-ui-evidence
        run: python3 tests/native/ui_smoke.py
      - name: Exercise saved UI authoring and editor save/resume
        env:
          KILN_TASK7_EDITOR_EVIDENCE_DIR: target/task7-editor-evidence
        run: python3 tests/native/task7_editor_smoke.py
      - name: Recover unsaved source after forced editor crashes
        run: python3 tests/native/script_recovery_smoke.py
      - name: Verify entity clipboard across scenes and restart
        run: python3 tests/native/entity_clipboard_smoke.py
      - name: Verify external art refresh and structured gameplay authoring
        run: python3 tests/native/asset_script_workflow_smoke.py
      - name: Pack the saved UI game
        run: target/debug/kiln-cli pack --source samples/ui2d_editor --output target/task7-game.kar
      - name: Exercise Task 7 save/resume across player restarts
        env:
          KILN_TASK7_EVIDENCE_DIR: target/task7-native-evidence
          KILN_TASK7_ARCHIVE: target/task7-game.kar
        run: python3 tests/native/task7_smoke.py
      - name: Exercise native and editor sprite material pixels
        run: python3 tests/native/materials_smoke.py
      - name: Exercise real editor export and output validation
        env:
          KILN_EXPORT_EVIDENCE_DIR: target/task8-export-evidence
        run: python3 tests/native/export_smoke.py
      - name: Play relocated export without Rust or archive arguments
        run: python3 tests/native/relocated_export.py
      - name: Upload native UI evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-ui-evidence
          path: |
            target/native-ui-evidence/
            target/editor-design-evidence/
            target/task7-native-evidence/
            target/task7-editor-evidence/
            target/task8-export-evidence/
            target/task8-relocated-evidence/
            target/task8-material-native-evidence/
            target/a02-script-recovery/result.json
            target/a02-script-recovery/editor/*.png
            target/a02-script-recovery/editor/*.log
            target/a02-script-recovery/*_before_crash.log
            target/a02-entity-clipboard/result.json
            target/a02-entity-clipboard/editor/*.png
            target/a02-entity-clipboard/editor/*.log
            target/a02-entity-clipboard/reopened/*.png
            target/a03-a04-workflow/result.json
            target/a03-a04-workflow/editor/*.png
            target/a03-a04-workflow/editor/*.log
          retention-days: 7

  web-smoke:
    name: Browser WASM and portable editor compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tests/web/package-lock.json
      - name: Install editor export test dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-x11-0 libgl1-mesa-dri mesa-vulkan-drivers xvfb xdotool imagemagick
      - name: Build the native editor, exporter and player
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
        run: cargo build --locked -p kiln-editor -p kiln-cli -p kiln-player --bins
      - name: Check WASM-specific code and feature opt-out
        run: |
          cargo clippy -p kiln-web --target wasm32-unknown-unknown -- -D warnings
          cargo clippy -p kiln-web --target wasm32-unknown-unknown --no-default-features -- -D warnings
      - name: Build the browser runtime
        run: cargo build --locked --target wasm32-unknown-unknown -p kiln-web
      - name: Install matching wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version "$(cargo tree -p wasm-bindgen --depth 0 --locked | awk '{print substr($2,2)}')" --locked
      - name: Generate JavaScript bindings
        run: wasm-bindgen target/wasm32-unknown-unknown/debug/kiln_web.wasm --target web --out-dir target/debug/web-runtime
      - name: Prepare matched browser runtime bundle
        run: target/debug/kiln-cli web-runtime --input target/debug/web-runtime
      - name: Install browser test dependencies
        working-directory: tests/web
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Verify editor-authored counted loops and dictionaries in the browser
        run: python3 tests/native/asset_script_workflow_smoke.py --web-runtime target/debug/web-runtime
      - name: Exercise rendering and input
        run: node tests/web/smoke.cjs target/debug/web-runtime
      - name: Exercise browser menus, audio, controller input and save/resume
        run: node tests/web/task7.cjs target/debug/web-runtime
      - name: Prepare a physics-disabled browser runtime for rejection coverage
        run: |
          cargo build --locked -p kiln-web --target wasm32-unknown-unknown --no-default-features --features fonts
          wasm-bindgen target/wasm32-unknown-unknown/debug/kiln_web.wasm --target web --out-dir target/web-no-physics-runtime
          target/debug/kiln-cli web-runtime --input target/web-no-physics-runtime
      - name: Exercise exported physics, joints, tile collision and save/scene restoration
        env:
          WEB_PHYSICS_MINIMAL_RUNTIME: target/web-no-physics-runtime
        run: node tests/web/physics.cjs target/debug/web-runtime
      - name: Exercise exported sprite materials, texture parameters and save restoration
        run: node tests/web/materials.cjs target/debug/web-runtime
      - name: Exercise Browser export in the native editor
        env:
          KILN_BROWSER_EXPORT_EVIDENCE_DIR: target/task8-browser-export-evidence
        run: python3 tests/native/browser_export_smoke.py
      - name: Play only the relocated browser artifact
        run: python3 tests/native/relocated_browser_export.py
      - name: Prepare portable development editor
        run: |
          cargo metadata --locked --format-version 1 --filter-platform x86_64-unknown-linux-gnu > target/portable-metadata.json
          cargo metadata --locked --format-version 1 --filter-platform wasm32-unknown-unknown > target/portable-web-metadata.json
          python3 tools/package_editor.py --binaries target/debug --web-runtime target/debug/web-runtime --metadata target/portable-metadata.json --metadata target/portable-web-metadata.json --output target/dist/kiln-portable-development.tar.gz
      - name: Exercise moved portable editor and both exported games
        run: python3 tests/native/portable_editor_smoke.py target/dist/kiln-portable-development.tar.gz
      - name: Exercise clean Ubuntu userspace without Rust or repository access
        run: python3 tools/test_clean_linux.py target/dist/kiln-portable-development.tar.gz
      - name: Upload browser UI and export evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: task7-browser-evidence
          path: |
            target/task7-web-evidence/
            target/task8-browser-export-evidence/
            target/task8-browser-evidence/
            target/task8-portable-evidence/
            target/task8-clean-linux-evidence/
            target/task8-physics-evidence/
            target/task8-material-evidence/
            target/a03-a04-workflow/result.json
            target/a03-a04-workflow/editor/*.png
            target/a03-a04-workflow/editor/*.log
            target/dist/kiln-portable-development.tar.gz
          retention-days: 7
