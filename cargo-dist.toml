# cargo-dist configuration for Kiln editor installers

[workspace]
members = ["kiln-editor"]

[dist]
# The package to build distributables for
cargo-dist-version = "0.33.0"

# CI configuration
precise-builds = true

# Installer configuration
installers = ["msi", "dmg", "appimage"]

# Build targets
targets = ["x86_64-pc-windows-msvc", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
