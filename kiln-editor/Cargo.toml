[package]
name = "kiln-editor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Kiln game engine editor"
homepage = "https://github.com/Erion-Simoni/kiln-engine"
repository.workspace = true

[[bin]]
name = "kiln-editor"
path = "src/main.rs"

[[test]]
name = "vertical_slice"
path = "tests/vertical_slice.rs"

[[test]]
name = "scene_view_test"
path = "src/scene_view_test.rs"

[features]
default = ["audio", "fonts", "gamepad"]
fonts = ["kiln-ui/fonts"]
audio = ["kiln-runtime/audio"]
gamepad = ["kiln-input/gamepad"]
# Git integration for the Version Control panel. Opt-in because it requires
# the system OpenSSL development headers (libssl-dev) to compile git2.
git = ["dep:git2"]

[dependencies]
kiln-core = { workspace = true }
kiln-render = { workspace = true }
kiln-runtime = { workspace = true, features = ["physics"] }
kiln-assets = { workspace = true }
kiln-graph = { workspace = true }
kiln-ui = { workspace = true }
kiln-ir = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
kiln-anim = { workspace = true }
kiln-vfx = { workspace = true }
kiln-input = { workspace = true }
rapier2d = { workspace = true }
kiln-ai = { workspace = true }
kiln-gameplay = { workspace = true }
winit = { workspace = true }
wgpu = { workspace = true }
pollster = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
thiserror = { workspace = true }
egui = { workspace = true }
egui_dock = { workspace = true }
egui-winit = "0.29"
egui-wgpu = "0.29"
glam = { workspace = true }
hecs = { workspace = true }
dirs = { workspace = true }
kiln-plugin-api = { path = "../kiln-plugin-api" }
git2 = { workspace = true, optional = true }
tempfile = "3.14"

[package.metadata.dist]
dist = true
