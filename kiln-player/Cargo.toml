[package]
name = "kiln-player"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "kiln_player"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
kiln-core = { workspace = true }
kiln-runtime = { workspace = true, features = ["physics"] }
kiln-assets = { workspace = true }
kiln-render = { workspace = true }
kiln-ui = { workspace = true }
kiln-input = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
wgpu = { workspace = true }
winit = { workspace = true }
pollster = { workspace = true }
ron = { workspace = true }
thiserror = { workspace = true }

[features]
default = ["audio", "fonts", "gamepad"]
fonts = ["kiln-ui/fonts"]
audio = ["kiln-runtime/audio"]
gamepad = ["kiln-input/gamepad"]

[dev-dependencies]
egui = { workspace = true }
kiln-editor = { workspace = true }
tempfile = "3.14"
serde = { workspace = true }
kiln-ir = { workspace = true }

[package.metadata.dist]
dist = true
