[package]
name = "kiln-player"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "kiln_player"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
kiln-core = { workspace = true }
kiln-runtime = { workspace = true }
kiln-assets = { workspace = true }
kiln-render = { workspace = true }
kiln-ui = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
wgpu = { workspace = true }
winit = { workspace = true, features = ["android-activity"] }
pollster = { workspace = true }
ron = { workspace = true }
thiserror = { workspace = true }

