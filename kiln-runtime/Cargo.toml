[package]
name = "kiln-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
audio = ["rodio", "symphonia"]
physics = ["rapier2d"]
# Parallel TaskPool + stage job execution (native threads). No extra crates.
threads = []

[dependencies]
kiln-core = { path = "../kiln-core" }
kiln-render = { path = "../kiln-render" }
kiln-input = { path = "../kiln-input" }
kiln-save = { path = "../kiln-save" }
hecs = { workspace = true }
winit = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Audio (feature-gated)
rodio = { version = "0.23", optional = true, default-features = false, features = ["symphonia-ogg", "symphonia-all", "playback"] }
symphonia = { version = "0.5", optional = true }

# Physics (feature-gated)
rapier2d = { version = "0.36.1", optional = true }
