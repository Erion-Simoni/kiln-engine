[workspace]
members = [
    "kiln-core",
    "kiln-render",
    "kiln-runtime",
    "kiln-assets",
    "kiln-cli",
    "kiln-web",
    "demo",
    "samples/tilemap",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
wgpu         = { version = "22.1" }
winit        = { version = "0.30.13" }
pollster     = "0.4"
glam         = "0.34.1"
hecs         = "0.11.2"
serde        = { version = "1.0", features = ["derive"] }
toml         = "0.8"
uuid         = { version = "1.0", features = ["v4", "serde"] }
bytemuck     = { version = "1.0", features = ["derive"] }
log          = "0.4"
env_logger   = "0.11"
sha2         = "0.10"
hex          = "0.4"
thiserror    = "2.0"
walkdir      = "2.5"
clap         = { version = "4.5", features = ["derive"] }
anyhow       = "1.0"
kiln-core    = { path = "kiln-core" }
kiln-render  = { path = "kiln-render" }
kiln-runtime = { path = "kiln-runtime" }
kiln-assets  = { path = "kiln-assets" }
