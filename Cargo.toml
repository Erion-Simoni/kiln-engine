[workspace]
members = [
    "kiln-core",
    "kiln-render",
    "kiln-runtime",
    "kiln-assets",
    "kiln-cli",
    "kiln-ir",
    "kiln-script",
    "kiln-graph",
    "kiln-editor",
    "kiln-web",
    "kiln-player",
    "kiln-platform",
    "kiln-updater",
    "kiln-anim",
    "demo",
    "samples/tilemap",
    "samples/audio",
    "samples/physics",
    "samples/collector",
    "samples/animation",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
wgpu         = { version = "22.1" }
winit        = { version = "0.30.13" }
pollster     = "0.4"
glam         = "0.34.1"
hecs         = "0.11.2"
serde        = { version = "1.0", features = ["derive"] }
serde_json   = "1.0"
toml         = "0.8"
ron          = "0.8"
uuid         = { version = "1.0", features = ["v4", "serde"] }
bytemuck     = { version = "1.0", features = ["derive"] }
log          = "0.4"
env_logger   = "0.11"
sha2         = "0.10"
hex          = "0.4"
thiserror    = "2.0"
walkdir      = "2.5"
clap         = { version = "4.5", features = ["derive"] }
anyhow       = "1.0"
dirs         = "5.0"
egui         = "0.29"
egui_dock    = "0.14"
qbsdiff      = "1.4"
android-activity = { version = "0.6", features = ["native-activity"] }
kiln-core    = { path = "kiln-core" }
kiln-render  = { path = "kiln-render" }
kiln-runtime = { path = "kiln-runtime" }
kiln-assets  = { path = "kiln-assets" }
kiln-ir      = { path = "kiln-ir" }
kiln-script  = { path = "kiln-script" }
kiln-graph   = { path = "kiln-graph" }
kiln-editor  = { path = "kiln-editor" }
kiln-web     = { path = "kiln-web" }
kiln-player  = { path = "kiln-player" }
kiln-platform = { path = "kiln-platform" }
kiln-updater = { path = "kiln-updater" }
kiln-anim    = { path = "kiln-anim" }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package."*"]
opt-level = "z"
codegen-units = 1
