[workspace]
members = [
    "kiln-core",
    "kiln-render",
    "kiln-runtime",
    "kiln-assets",
    "kiln-cli",
    "kiln-ir",
    "kiln-script",
    "kiln-graph",
    "kiln-editor",
    "kiln-web",
    "kiln-player",
    "kiln-platform",
    "kiln-updater",
    "kiln-anim",
    "kiln-vfx",
    "kiln-ui",
    "kiln-input",
    "kiln-save",
    "kiln-ai",
    "kiln-gameplay",
    "kiln-plugin-api",
    "demo",
    "samples/tilemap",
    "samples/sprites",
    "samples/physics",
    "samples/collector",
    "samples/animation",
    "samples/particles",
    "samples/ui",
    "samples/input_save",
    "samples/ai",
    "samples/gameplay",
    "samples/threads",
    "samples/render_graph",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Erion-Simoni/kiln-engine"

[workspace.dependencies]
wgpu         = { version = "22.1" }
winit        = { version = "0.30.13" }
pollster     = "0.4"
glam         = "0.34.1"
hecs         = { version = "0.11.2", features = ["macros"] }
git2         = "0.18"
serde        = { version = "1.0", features = ["derive"] }
serde_json   = "1.0"
toml         = "0.8"
ron          = "0.8"
uuid         = { version = "1.0", features = ["v4", "serde"] }
kiln-plugin-api = { path = "kiln-plugin-api" }
getrandom    = { version = "0.4", features = ["std"] }
bytemuck     = { version = "1.0", features = ["derive"] }
log          = "0.4"
env_logger   = "0.11"
sha2         = "0.10"
hex          = "0.4"
thiserror    = "2.0"
walkdir      = "2.5"
fontdue      = "0.6"
image        = "0.25"
clap         = { version = "4.5", features = ["derive"] }
anyhow       = "1.0"
dirs         = "5.0"
egui         = "0.29"
egui_dock    = "0.14"
qbsdiff      = "1.4"
rand         = "0.8"
chrono       = "0.4"
gilrs        = "0.10"
mdbook       = "0.4"
rodio        = { version = "0.19" }
symphonia    = { version = "0.7", features = ["vorbis", "ogg"] }
cpal         = { version = "0.15" }
kiln-core    = { path = "kiln-core" }
kiln-render  = { path = "kiln-render" }
kiln-runtime = { path = "kiln-runtime" }
kiln-assets  = { path = "kiln-assets" }
kiln-ir      = { path = "kiln-ir" }
kiln-script  = { path = "kiln-script" }
kiln-graph   = { path = "kiln-graph" }
kiln-editor  = { path = "kiln-editor" }
kiln-web     = { path = "kiln-web" }
kiln-player  = { path = "kiln-player" }
kiln-platform = { path = "kiln-platform" }
kiln-updater = { path = "kiln-updater" }
kiln-anim    = { path = "kiln-anim" }
kiln-vfx     = { path = "kiln-vfx" }
kiln-ui      = { path = "kiln-ui" }
kiln-input   = { path = "kiln-input" }
rapier2d   = { version = "0.36.1" }
kiln-save    = { path = "kiln-save" }
kiln-ai      = { path = "kiln-ai" }
kiln-gameplay = { path = "kiln-gameplay" }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package."*"]
opt-level = "z"
codegen-units = 1

# cargo-dist binary archives are experimental; complete editor distributions use
# tools/package_editor.py and the accepted portable candidate workflows.
[workspace.metadata.dist]
cargo-dist-version = "0.33.0"
dist = false
precise-builds = true
targets = ["x86_64-pc-windows-msvc", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
installers = []

# cargo-dist invokes this named profile for binary archives.
[profile.dist]
inherits = "release"
