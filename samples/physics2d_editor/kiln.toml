id = "kiln-physics2d-editor"
name = "Physics and Cameras 2D"
version = "0.1.0"
publisher = "Kiln"
icon = ""
features = ["physics"]

[window]
width = 640
height = 360

[cameras.main]
target = "hero"
position = [160.0, 80.0]
zoom = 1.0
smoothing = 6.0
bounds = [0.0, 0.0, 1400.0, 360.0]
pixel_perfect = true
pixels_per_unit = 1.0

[scenes.main]
id = "main"
name = "Physics Playground"

[[scenes.main.entities]]
id = "floor"
name = "Floor"
components = [
  { type = "Transform", x = 700.0, y = 10.0, rotation = 0.0, scale = 1.0 },
  { type = "Sprite", color = [0.2, 0.35, 0.5, 1.0], width = 1400.0, height = 20.0 },
  { type = "Physics", body = { body_type = "Static", linear_velocity = [0.0, 0.0], angular_velocity = 0.0, gravity_scale = 1.0, can_sleep = true }, collider = { shape = { Rectangle = { half_width = 700.0, half_height = 10.0 } }, is_sensor = false, friction = 1.0, restitution = 0.0, density = 1.0, layer = 1, mask = 2 } },
]

[[scenes.main.entities]]
id = "hero"
