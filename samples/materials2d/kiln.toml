[[scenes.main.entities]]
id = "alpha_back"
name = "alpha_back"
components = [
 { type = "Transform", x = 100.0, y = 80.0, rotation = 0.0, scale = 1.0 },
 { type = "Sprite", color = [0, 0, 1, 1], width = 64.0, height = 64.0, layer = 0.0 },
]

[[scenes.main.entities]]
id = "alpha_material"
name = "alpha_material"
components = [
 { type = "Transform", x = 100.0, y = 80.0, rotation = 0.0, scale = 1.0 },
 { type = "Sprite", color = [1, 1, 1, 1], width = 64.0, height = 64.0, layer = 1.0, material = "alpha_red" },
]

[[scenes.main.entities]]
id = "alpha_front"
name = "alpha_front"
