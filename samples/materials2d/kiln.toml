[scenes.next]
id = "next"
name = "Next material scene"
script = "scripts/game.ks"

[[scenes.next.entities]]
id = "changed_scene"
name = "changed_scene"
components = [
 { type = "Transform", x = 80.0, y = 260.0, rotation = 0.0, scale = 1.0 },
 { type = "Sprite", color = [1, 1, 1, 1], width = 64.0, height = 64.0, layer = 0.0, material = "texture_blue" },
]

[action_map.actions.save]
id = "save"
name = "save"
bindings = [{ binding_type = { Key = "s" } }]

[action_map.actions.load]
id = "load"
name = "load"
bindings = [{ binding_type = { Key = "l" } }]

[action_map.actions.next]
id = "next"
name = "next"
bindings = [{ binding_type = { Key = "n" } }]

[shaders.tint]
id = "tint"
name = "Typed tint"
entry_point = "paint"
source = '''
@fragment fn paint(in: VertexOutput) -> @location(0) vec4<f32> {
 let texel = textureSample(sprite_tex, sprite_sampler, in.uv + offset);
 return vec4<f32>(texel.rgb * in.color.rgb * tint.rgb * brightness * gain * extra.rgb, texel.a * in.color.a * tint.a * extra.a);
}
'''
[shaders.tint.parameters]
tint = { Color = [0.0,1.0,0.0,1.0] }
brightness = { Float = 1.0 }
offset = { Vec2 = [0.0,0.0] }
gain = { Vec3 = [1.0,1.0,1.0] }
extra = { Vec4 = [1.0,1.0,1.0,1.0] }
[shaders.texture]
id = "texture"
name = "Named texture"
entry_point = "paint"
source = '''
@fragment fn paint(in: VertexOutput) -> @location(0) vec4<f32> {
 return textureSample(accent, accent_sampler, in.uv) * in.color;
}
'''
[shaders.texture.parameters]
accent = { Texture = "assets/red.png" }
[shaders.identity]
id = "identity"
name = "Identity fragment"
entry_point = "fs_main"
source = '''
@fragment fn fs_main(in: VertexOutput) -> @location(0) vec4<f32> {
 return textureSample(sprite_tex, sprite_sampler, in.uv) * in.color;
}
'''

[materials.green]
id = "green"
name = "green"
shader = "tint"
[materials.green.parameters]


[materials.red]
id = "red"
name = "red"
shader = "tint"
[materials.red.parameters]
tint = { Color = [1.0,0.0,0.0,1.0] }

[materials.dark_red]
id = "dark_red"
name = "dark_red"
shader = "tint"
[materials.dark_red.parameters]
tint = { Color = [1.0,0.0,0.0,1.0] }
brightness = { Float = 0.25 }

[materials.alpha_red]
id = "alpha_red"
name = "alpha_red"
shader = "tint"
[materials.alpha_red.parameters]
tint = { Color = [1.0,0.0,0.0,0.5] }

[materials.texture_red]
id = "texture_red"
name = "texture_red"
shader = "texture"
[materials.texture_red.parameters]


[materials.texture_blue]
id = "texture_blue"
name = "texture_blue"
shader = "texture"
[materials.texture_blue.parameters]
accent = { Texture = "assets/blue.png" }

[materials.identity]
id = "identity"
name = "identity"
shader = "identity"
[materials.identity.parameters]


[ui]
initial_screen = "hud"
[ui.screens.hud]
name = "Material controls"
pause_game = false
modal = false
allow_cancel = false
[[ui.screens.hud.widgets]]
id = "help"
kind = "Label"
blocks_pointer = false
text = "S save / L load / N next scene"
font_size = 14.0
text_align = [0.0,0.0]
[ui.screens.hud.widgets.layout]
offset = [10.0,10.0]
size = [610.0,28.0]
