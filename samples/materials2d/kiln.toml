[[scenes.main.entities]]
id = "default_texture"
name = "default_texture"
components = [
 { type = "Transform", x = 80.0, y = 170.0, rotation = 0.0, scale = 1.0 },
 { type = "Sprite", color = [1, 1, 1, 1], width = 64.0, height = 64.0, layer = 0.0, material = "texture_red" },
]

[[scenes.main.entities]]
id = "overridden_texture"
name = "overridden_texture"
components = [
 { type = "Transform", x = 180.0, y = 170.0, rotation = 0.0, scale = 1.0 },
 { type = "Sprite", color = [1, 1, 1, 1], width = 64.0, height = 64.0, layer = 0.0, material = "texture_blue" },
