id = "saved-ui-2d"
name = "Saved UI demo"
version = "0.1.0"
publisher = ""
icon = ""
features = []

[window]
width = 640
height = 360
fullscreen = false
borderless = false
vsync = true
high_dpi = true
resizable = true
monitor = 0

[mobile]
orientation = "landscape"

[mobile.ios]
bundle_identifier = "com.example.game"
permissions = []
supports_notch = true

[mobile.ios.privacy_descriptions]
camera = ""
microphone = ""
photo_library = ""
location = ""

[mobile.ios.launch_screen]
image = ""
background_color = "#000000"

[mobile.android]
package_name = "com.example.game"
permissions = []
target_sdk = 33

[scenes.main]
id = "main"
name = "Main"
nested_scenes = []
script = "scripts/main.ks"

[[scenes.main.entities]]
