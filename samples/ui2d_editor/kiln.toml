x = 40.0
y = 60.0
rotation = 0.0
scale = 1.0

[[scenes.main.entities.components]]
type = "Role"
role = "player"

[[scenes.main.entities.components]]
type = "Sprite"
color = [
    0.20000000298023224,
    0.5,
    1.0,
    1.0,
]
width = 20.0
height = 20.0
layer = 0.0

[[scenes.main.entities]]
id = "ui"
name = "UI controller"

[[scenes.main.entities.components]]
type = "Script"
path = "scripts/ui.ks"

[scenes.main.entities.components.properties]

[cameras]

[tilemaps]

[terrains]

[tilesets]

[animation_clips]

[shaders]

