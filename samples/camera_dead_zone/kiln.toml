id = "camera-dead-zone"
name = "Camera Dead Zone"
version = "0.1.0"
features = []

[window]
width = 320
height = 240

[cameras.main]
target = "hero"
zoom = 1.0
smoothing = 0.0
dead_zone = [64.0, 32.0]
bounds = [0.0, 0.0, 960.0, 480.0]

[scenes.main]
id = "main"
name = "Camera remains still inside its zone"
script = "scripts/main.ks"
nested_scenes = []

[[scenes.main.entities]]
id = "hero"
name = "Invisible camera target"
components = [{ type = "Transform", x = 160.0, y = 120.0, rotation = 0.0, scale = 1.0 }]

[[scenes.main.entities]]
id = "actor"
name = "Stationary screen-position witness"
components = [
  { type = "Transform", x = 160.0, y = 120.0, rotation = 0.0, scale = 1.0 },
  { type = "Sprite", color = [1.0, 0.0, 0.0, 1.0], width = 64.0, height = 64.0, layer = 0.0 },
]
